name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
  workflow_dispatch:

concurrency:
  group: blog-app-eks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Restrict EKS API access to this runner
        shell: bash
        run: |
          runner_ip="$(curl --fail --silent --show-error https://checkip.amazonaws.com | tr -d '\r\n')"
          if [[ ! "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Could not determine a valid runner IPv4 address."
            exit 1
          fi
          cidrs="$(jq -cn --arg cidr "${runner_ip}/32" '[$cidr]')"
          echo "TF_VAR_cluster_endpoint_public_access_cidrs=$cidrs" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name blog-prod-eks --region "${{ secrets.AWS_REGION }}"

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml
          kubectl rollout status deployment/argocd-server -n argocd --timeout=10m
          kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=2m

      - name: Register the GitOps application
        run: kubectl apply -f ../argocd/application.yaml
