name: "Terraform Apply"

on:
  workflow_dispatch:
    inputs:
      auto_approve:
        description: "Set to 'true' to apply changes after the plan"
        required: true
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  ROLE_ARN: "arn:aws:iam::122384809512:role/github-actions-blog-app-role"
  TF_VERSION: "1.12.2"

jobs:
  terraform-apply:
    name: "Terraform Plan & Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # OIDC authentication — no static credentials
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check || true

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -lock=false -input=false

      - name: Terraform Apply
        if: ${{ github.event.inputs.auto_approve == 'true' }}
        run: terraform apply -lock=false -auto-approve tfplan
