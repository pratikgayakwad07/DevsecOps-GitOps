name: Blog App DevSecOps CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "infra/**"
      - "K8's/kustomization.yaml"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/destroy.yml"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "infra/**"
      - "K8's/kustomization.yaml"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/destroy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-app-eks-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_FRONTEND_REPOSITORY: prod/blog-app
  ECR_BACKEND_REPOSITORY: prod/backend-blog-app
  EKS_CLUSTER_NAME: blog-prod-eks
  K8S_NAMESPACE: blog-app

jobs:

  # --------------------------------------------------
  # JOB 1: SECRET SCANNING
  # --------------------------------------------------

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # --------------------------------------------------
  # JOB 2: DEPENDENCY SECURITY AUDIT
  # --------------------------------------------------

  
  dependency-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify package files
        working-directory: ${{ matrix.app }}
        run: |
          test -f package.json
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund

      - name: Run dependency audit
        working-directory: ${{ matrix.app }}
        run: npm audit --audit-level=high

  # --------------------------------------------------
  # JOB 3: FILESYSTEM SECURITY SCAN
  # --------------------------------------------------

  filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan filesystem
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: frontend/node_modules,backend/node_modules,infra/.terraform
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # --------------------------------------------------
  # JOB 4: APPLICATION BUILD AND TESTS
  # --------------------------------------------------

  application-build:
    name: Application Build
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - dependency-audit
      - filesystem-scan

    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend
          - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install --no-audit --no-fund

      - name: Run application tests
        working-directory: ${{ matrix.app }}
        shell: bash
        run: |
          if npm run | grep -qE '^[[:space:]]+test([[:space:]]|$)'; then
            npm test --if-present
          else
            echo "No test script configured."
          fi
      - name: Build frontend
        if: matrix.app == 'frontend'
        working-directory: frontend
        run: npm run build

  # --------------------------------------------------
  # JOB 5: BUILD, SCAN AND PUSH DOCKER IMAGES
  # --------------------------------------------------

  docker-publish:
    name: Docker Build, Scan and Push
    runs-on: ubuntu-latest

    needs:
      - application-build

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image-tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # IMPORTANT:
      # Create GitHub repository secret AWS_ROLE_ARN.
      # Never hardcode AWS access keys.

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsSession

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repositories
        run: |
          aws ecr describe-repositories \
            --repository-names \
              "$ECR_FRONTEND_REPOSITORY" \
              "$ECR_BACKEND_REPOSITORY"

      - name: Build frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build --pull \
            -t "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" \
            ./frontend

      - name: Build backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker build --pull \
            -t "$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" \
            ./backend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ steps.image-tag.outputs.tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push frontend image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker push "$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"

      - name: Push backend image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker push "$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"

  # --------------------------------------------------
  # JOB 6: UPDATE GITOPS MANIFESTS
  # --------------------------------------------------

  update-gitops:
    name: Update Kubernetes Image Tags
    runs-on: ubuntu-latest

    needs:
      - docker-publish

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Verify Kustomize configuration
        run: |
          test -f "K8's/kustomization.yaml"
          kustomize build "K8's" > /tmp/rendered-manifests.yaml

      - name: Update frontend and backend image tags
        working-directory: "K8's"
        env:
          REGISTRY: ${{ needs.docker-publish.outputs.registry }}
          IMAGE_TAG: ${{ needs.docker-publish.outputs.image_tag }}
        run: |
          kustomize edit set image \
            "$REGISTRY/$ECR_FRONTEND_REPOSITORY=$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"

          kustomize edit set image \
            "$REGISTRY/$ECR_BACKEND_REPOSITORY=$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"

          kustomize build . > /tmp/rendered-manifests.yaml

      - name: Commit GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "K8's/kustomization.yaml"

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push origin HEAD:main

  # --------------------------------------------------
  # JOB 7: VERIFY EKS DEPLOYMENT
  # --------------------------------------------------

  deployment-verification:
    name: Verify Argo CD and EKS Deployment
    runs-on: ubuntu-latest

    needs:
      - docker-publish
      - update-gitops

    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActionsVerify

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Wait for Argo CD to apply expected images
        env:
          REGISTRY: ${{ needs.docker-publish.outputs.registry }}
          IMAGE_TAG: ${{ needs.docker-publish.outputs.image_tag }}
        shell: bash
        run: |
          expected_frontend="$REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"
          expected_backend="$REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"

          for attempt in $(seq 1 90); do
            frontend_image=$(kubectl get deployment frontend \
              -n "$K8S_NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}' \
              2>/dev/null || true)

            backend_image=$(kubectl get deployment backend \
              -n "$K8S_NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}' \
              2>/dev/null || true)

            if [[ "$frontend_image" == "$expected_frontend" &&
                  "$backend_image" == "$expected_backend" ]]; then
              echo "Expected images applied by Argo CD."
              break
            fi

            if [[ "$attempt" -eq 90 ]]; then
              echo "Expected images were not applied."
              echo "Frontend: $frontend_image"
              echo "Backend: $backend_image"
              exit 1
            fi

            sleep 10
          done

      - name: Verify application rollouts
        run: |
          kubectl rollout status deployment/frontend \
            -n "$K8S_NAMESPACE" --timeout=10m

          kubectl rollout status deployment/backend \
            -n "$K8S_NAMESPACE" --timeout=10m

          kubectl rollout status statefulset/mysql \
            -n "$K8S_NAMESPACE" --timeout=10m

      - name: Smoke test frontend and backend API
        shell: bash
        run: |
          endpoint=""

          for attempt in $(seq 1 60); do
            endpoint=$(kubectl get service frontend-service \
              -n "$K8S_NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}' \
              2>/dev/null || true)

            if [[ -n "$endpoint" ]]; then
              break
            fi

            sleep 10
          done

          if [[ -z "$endpoint" ]]; then
            echo "Frontend LoadBalancer endpoint not found."
            exit 1
          fi

          echo "Testing frontend endpoint..."

          curl --fail --silent --show-error \
            --retry 12 \
            --retry-connrefused \
            --retry-delay 5 \
            --max-time 15 \
            "http://$endpoint/"

          echo "Testing backend API..."

          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 15 \
            "http://$endpoint/api/posts" |
            jq -e 'type == "array"'

  # --------------------------------------------------
  # JOB 8: SUCCESS NOTICE
  # --------------------------------------------------

  deployment-notice:
    name: Deployment Successful
    runs-on: ubuntu-latest

    needs:
      - deployment-verification

    if: needs.deployment-verification.result == 'success'

    steps:
      - name: Report successful deployment
        run: |
          echo "CI/CD completed successfully."
          echo "Docker images published to ECR."
          echo "GitOps manifests updated."
          echo "EKS deployment and smoke tests passed."
