name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to permanently remove the AWS infrastructure"
        required: true
        type: string

jobs:
  confirm:
    name: Confirm infrastructure destruction
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: inputs.confirm_destroy != 'DESTROY'
        run: |
          echo "Set confirm_destroy to DESTROY to continue."
          exit 1

  terraform-destroy:
    name: Destroy Dev Infrastructure
    runs-on: ubuntu-latest
    needs: confirm
    if: inputs.confirm_destroy == 'DESTROY'

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
