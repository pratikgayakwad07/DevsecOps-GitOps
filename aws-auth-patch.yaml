apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: arn:aws:iam::122384809512:role/blog_nodes-eks-node-group-20261026063318300700000001
      groups:
      - system:bootstrappers
      - system:nodes
      username: system:node:{{EC2PrivateDNSName}}
    - rolearn: arn:aws:iam::122384809512:role/github-actions-blog-app-role
      groups:
      - system:masters
      username: github-actions
