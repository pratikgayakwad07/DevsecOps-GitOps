apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql
  namespace: blog-app

spec:
  serviceName: mysql-service

  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:

    metadata:
      labels:
        app: mysql

    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: mysql
        image: mysql:8.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        ports:
        - containerPort: 3306

        env:

        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD

        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE

        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER

        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD

        volumeMounts:

        - name: mysql-storage
          mountPath: /var/lib/mysql

        - name: mysql-init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true

        - name: mysql-tmp
          mountPath: /tmp

        - name: mysql-run
          mountPath: /var/run/mysqld

        resources:

          requests:
            cpu: 200m
            memory: 256Mi

          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:

          exec:
            command:
            - mysqladmin
            - ping
            - "-h"
            - "127.0.0.1"

          initialDelaySeconds: 20
          periodSeconds: 10

        livenessProbe:

          exec:
            command:
            - mysqladmin
            - ping
            - "-h"
            - "127.0.0.1"

          initialDelaySeconds: 40
          periodSeconds: 20

      volumes:

      - name: mysql-storage

        persistentVolumeClaim:
          claimName: mysql-pvc

      - name: mysql-init
        configMap:
          name: mysql-config

      - name: mysql-tmp
        emptyDir:
          sizeLimit: 256Mi

      - name: mysql-run
        emptyDir:
          sizeLimit: 16Mi