# Grafana dashboard provider — auto-loads dashboards from a directory
# Place this file at: /etc/grafana/provisioning/dashboards/dashboard-provider.yaml
apiVersion: 1

providers:
  - name: "blog-app-dashboards"
    orgId: 1
    folder: "Blog App"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      # Path inside the Grafana container — mount the grafana-dashboard.json here
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
