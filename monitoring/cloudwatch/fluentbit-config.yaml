# Fluent Bit ConfigMap for EKS log collection to CloudWatch Logs
# Used alongside the CloudWatch agent DaemonSet to ship pod logs.
#
# Apply with: kubectl apply -f monitoring/cloudwatch/fluentbit-config.yaml
# Then install the Fluent Bit DaemonSet from:
#   https://raw.githubusercontent.com/aws-samples/amazon-cloudwatch-container-insights/latest/k8s-deployment-manifest-templates/deployment-mode/daemonset/container-insights-monitoring/fluent-bit/fluent-bit.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-cluster-info
  namespace: amazon-cloudwatch
data:
  cluster.name: blog-prod-eks
  http.server: "On"
  http.port: "2020"
  read.head: "Off"
  read.tail: "On"
  logs.region: us-east-1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: amazon-cloudwatch
  labels:
    k8s-app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush             5
        Log_Level         info
        Daemon            off
        Parsers_File      parsers.conf
        HTTP_Server       On
        HTTP_Listen       0.0.0.0
        HTTP_Port         2020

    @INCLUDE application-log.conf
    @INCLUDE dataplane-log.conf
    @INCLUDE host-log.conf

  application-log.conf: |
    [INPUT]
        Name              tail
        Tag               application.*
        Exclude_Path      /var/log/containers/cloudwatch-agent*,/var/log/containers/fluent-bit*,/var/log/containers/aws-node*,/var/log/containers/kube-proxy*
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        DB                /var/fluent-bit/state/flb_container.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name              kubernetes
        Match             application.*
        Kube_URL          https://kubernetes.default.svc:443
        Kube_Tag_Prefix   application.var.log.containers.
        Merge_Log         On
        Merge_Log_Key     log_processed
        K8S-Logging.Parser On
        K8S-Logging.Exclude Off
        Labels            Off
        Annotations       Off

    [OUTPUT]
        Name              cloudwatch_logs
        Match             application.*
        region            us-east-1
        log_group_name    /aws/containerinsights/blog-prod-eks/application
        log_stream_prefix ${HOST_NAME}-
        auto_create_group true
        extra_user_agent  container-insights

  dataplane-log.conf: |
    [INPUT]
        Name              systemd
        Tag               dataplane.systemd.*
        Systemd_Filter    _SYSTEMD_UNIT=docker.service
        Systemd_Filter    _SYSTEMD_UNIT=kubelet.service
        DB                /var/fluent-bit/state/systemd.db
        Path              /var/log/journal
        Read_From_Tail    On

    [OUTPUT]
        Name              cloudwatch_logs
        Match             dataplane.*
        region            us-east-1
        log_group_name    /aws/containerinsights/blog-prod-eks/dataplane
        log_stream_prefix ${HOST_NAME}-
        auto_create_group true
        extra_user_agent  container-insights

  host-log.conf: |
    [INPUT]
        Name              tail
        Tag               host.dmesg
        Path              /var/log/dmesg
        Key               message
        Refresh_Interval  10
        Read_from_Head    True

    [INPUT]
        Name              tail
        Tag               host.messages
        Path              /var/log/messages
        Parser            syslog
        DB                /var/fluent-bit/state/flb_system_messages.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        Read_from_Head    True

    [OUTPUT]
        Name              cloudwatch_logs
        Match             host.*
        region            us-east-1
        log_group_name    /aws/containerinsights/blog-prod-eks/host
        log_stream_prefix ${HOST_NAME}.
        auto_create_group true
        extra_user_agent  container-insights

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ

    [PARSER]
        Name        syslog
        Format      regex
        Regex       ^(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
        Time_Key    time
        Time_Format %b %d %H:%M:%S
